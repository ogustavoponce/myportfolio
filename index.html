<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gustavo Ponce | Financial Developer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

    <div class="top-bar">
        <div class="container top-bar-content">
            <div class="market-data">
                <span class="indicator">🇺🇸 USD <strong id="val-usd">...</strong></span>
                <span class="indicator">🇪🇺 EUR <strong id="val-eur">...</strong></span>
                <span class="indicator">₿ BTC <strong id="val-btc">...</strong></span>
            </div>
            <div class="system-status">
                <span class="dot"></span> System Operational
            </div>
        </div>
    </div>

    <header class="main-header">
        <div class="container header-wrapper">
            <a href="#" class="brand-logo" onclick="app.render('home'); return false;">
                GP<span class="highlight">.</span>Finance
            </a>
            <nav class="nav-links">
                <a href="#" class="nav-item active" data-target="home">Dashboard</a>
                <a href="#" class="nav-item" data-target="finance">Asset Management</a>
                <a href="#" class="nav-item" data-target="tech">Engenharia</a>
            </nav>
            <div class="header-actions">
                <a href="mailto:contato@gustavoponce.com" class="btn-contact">Contato Comercial</a>
            </div>
            <button class="mobile-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
        </div>
    </header>

    <main class="container" id="app-content">
        </main>

    <footer id="app-footer">
        </footer>

    <script src="js/app.js"></script>
</body>
</html>
